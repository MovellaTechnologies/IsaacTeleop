#
# Run with: python -m isaacteleop.rig rigs/xsens_full_body.yaml --no-runtime
#
# Feed frames from MVN Studio (Network Streamer -> "Isaac Teleop" preset -> 127.0.0.1:9764,
# then Play), or headless with mvn_isaac_devtools/tools/teleop_udp/teleop_sender 6000 9764 1.
name: xsens_full_body
description: CloudXR runtime + Xsens MVN full-body pusher + C++ printer + viser skeleton
cwd: ..                          # -> IsaacTeleop repo root
params:
  collection_id: xsens_full_body # producer and consumers rendezvous here; a mismatch is
                                 # SILENT no-data, so it is defined once and referenced
  udp_port: 9764                 # MVN Studio "Isaac Teleop" preset target
  viser_port: 8080
producers:
  - name: xsens full body pusher (needs MVN Studio streaming to udp_port)
    command: "install/plugins/xsens_full_body/xsens_full_body_plugin {collection_id} {udp_port}"
consumers:
  - name: xsens full body printer (numeric check - pelvis Y ~0.96, handsValid)
    command: "install/examples/xsens_full_body/xsens_full_body_printer {collection_id}"
  - name: xsens viser skeleton (http://localhost:8080)
    command: "{python} examples/mcap_record_replay/python/xsens_live_full_body.py --collection {collection_id} --port {viser_port}"
